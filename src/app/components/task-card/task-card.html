<div class="task-card card" cdkDrag [cdkDragData]="task">

  <div class="task-card-header">
    <span class="task-drag-handle" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
        <circle cx="9" cy="5" r="1.5" />
        <circle cx="9" cy="12" r="1.5" />
        <circle cx="9" cy="19" r="1.5" />
        <circle cx="15" cy="5" r="1.5" />
        <circle cx="15" cy="12" r="1.5" />
        <circle cx="15" cy="19" r="1.5" />
      </svg>
    </span>

    <span class="task-title">{{ task.title }}</span>

    <button class="btn-icon task-delete-btn" [id]="'delete-task-' + task.id" aria-label="Delete task"
      title="Delete task" (click)="onDelete($event)">
      <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18" />
        <line x1="6" y1="6" x2="18" y2="18" />
      </svg>
    </button>
  </div>

  @if (isCompleted()) {
  <app-task-stats [task]="task" [columns]="columns" />
  }

  <div *cdkDragPlaceholder class="task-card-placeholder"></div>
</div>
